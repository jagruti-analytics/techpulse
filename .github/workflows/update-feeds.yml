name: Refresh tech news
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public RSS feeds
        run: python fetch_feeds.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit updated headlines
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/articles.json data/insights.json data/github-trending.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh technology headlines'
            git push
          fi
